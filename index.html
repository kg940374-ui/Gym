<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#090a0d" id="themeMeta"><meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default"><meta name="apple-mobile-web-app-title" content="Kevin's Logs">
<title>gym</title>
<style>
:root{--bg:#f7f7fb;--card:#fff;--ink:#17181c;--muted:#858a96;--line:#e8e9ee;--accent:#ff6b35;--green:#22b573;--blue:#5b5cf0;--shadow:0 8px 24px rgba(20,20,30,.07)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",sans-serif}body{overscroll-behavior:none}button,input,select,textarea{font:inherit}input,select,textarea{font-size:16px!important}button{border:0;cursor:pointer}.app{max-width:430px;min-height:100vh;margin:auto;padding-bottom:calc(88px + env(safe-area-inset-bottom))}
header{padding:calc(18px + env(safe-area-inset-top)) 18px 10px;display:flex;justify-content:space-between;align-items:center}.brand{font-size:28px;font-weight:800;letter-spacing:-.8px}.sub{font-size:13px;color:var(--muted);margin-top:3px}.pill{background:#fff;padding:9px 12px;border-radius:999px;box-shadow:var(--shadow);font-weight:700}
main{padding:8px 15px}.weekbar{display:grid;grid-template-columns:28px 1fr 28px;align-items:center;gap:5px;margin:8px 0 14px}.weekdays{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}.day{padding:8px 2px;border-radius:16px;background:#fff;color:#858a96;text-align:center;box-shadow:var(--shadow)}.day.active{background:var(--ink);color:#fff}.day .num{font-weight:800;font-size:15px;margin-top:3px}.arrow{background:transparent;color:#555;font-size:24px;padding:4px}
.summary{background:linear-gradient(135deg,#17181c,#30323a);color:#fff;border-radius:24px;padding:18px;box-shadow:var(--shadow);margin-bottom:14px}.summary small{opacity:.65}.summary h2{margin:4px 0 12px;font-size:23px}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.stat{background:#ffffff12;border-radius:15px;padding:10px}.stat b{display:block;font-size:18px}.stat span{font-size:10px;opacity:.7}
.section{display:flex;justify-content:space-between;align-items:center;margin:16px 3px 8px}.section h3{margin:0;font-size:17px}.btn{border-radius:999px;padding:11px 15px;font-weight:800;background:var(--ink);color:#fff}.btn.orange{background:var(--accent)}.btn.light{background:#fff;color:var(--ink);box-shadow:var(--shadow)}
.card{background:var(--card);border:1px solid var(--line);border-radius:21px;padding:14px;margin:9px 0;box-shadow:var(--shadow)}.exhead{display:flex;justify-content:space-between;align-items:center}.exname{font-size:16px;font-weight:800}.tag{font-size:10px;background:#f0f1f5;padding:5px 8px;border-radius:999px;color:#6e7380}.sets{margin-top:10px;display:grid;gap:7px}.set{display:grid;grid-template-columns:25px 1fr 1fr 40px;gap:6px;align-items:center}.setnum{font-size:11px;color:var(--muted);text-align:center}.set input{min-width:0;width:100%;border:1px solid var(--line);background:#f7f8fa;border-radius:12px;padding:10px;text-align:center;font-weight:700;outline:none}.set input:focus{border-color:#bbb}.check{width:40px;height:40px;border-radius:13px;background:#f0f1f5;color:#999;font-weight:900}.check.done{background:var(--green);color:#fff}.mini{padding:7px 9px;border-radius:10px;background:#f1f2f5;color:#666;font-size:11px;font-weight:800}.empty{text-align:center;padding:38px 15px;color:var(--muted)}.bottom{position:fixed;left:50%;bottom:0;transform:translateX(-50%);width:min(430px,100%);padding:9px 12px calc(9px + env(safe-area-inset-bottom));background:#fffffff2;backdrop-filter:blur(18px);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(4,1fr);z-index:5}.nav{background:none;color:#999;padding:5px}.nav.active{color:var(--ink)}.nav b{display:block;font-size:11px;margin-top:2px}.nav span{font-size:20px}.modal{display:none;position:fixed;inset:0;background:#0006;z-index:20;align-items:flex-end}.modal.open{display:flex}.sheet{width:min(430px,100%);margin:auto;background:#fff;border-radius:25px 25px 0 0;padding:20px 17px calc(20px + env(safe-area-inset-bottom));max-height:85vh;overflow:auto}.sheet h2{margin:0 0 15px}.field{margin:11px 0}.field label{display:block;font-size:12px;font-weight:800;margin-bottom:6px}.field input,.field select,.field textarea{width:100%;border:1px solid var(--line);border-radius:13px;padding:11px;background:#f7f8fa;outline:none}.row{display:flex;gap:8px}.row>*{flex:1}.historyitem{display:flex;justify-content:space-between;padding:13px 0;border-bottom:1px solid var(--line)}.danger{color:#d33;background:#fff}.timer{position:fixed;left:50%;top:calc(12px + env(safe-area-inset-top));transform:translateX(-50%);z-index:30;background:#17181c;color:#fff;border-radius:999px;padding:10px 15px;display:none;box-shadow:var(--shadow)}.timer.show{display:block}
</style>
<style>
:root{--bg:#f7f7fb;--card:#fff;--ink:#17181c;--muted:#858a96;--line:#e8e9ee;--soft:#f0f1f5;--accent:#ff6b35}
html[data-theme="dark"]{--bg:#090a0d;--card:#15171c;--ink:#f5f7fa;--muted:#9da3ae;--line:#292d35;--soft:#20232a}
body{background:var(--bg);color:var(--ink)}
.card,.day,.pill,.theme-btn,.btn.light{background:var(--card);color:var(--ink);border-color:var(--line)}
.set input,.field input,.field select,.field textarea{background:var(--soft);color:var(--ink);border-color:var(--line);font-size:16px!important}
.bottom{background:color-mix(in srgb,var(--card) 94%,transparent);border-color:var(--line)}
.summary{position:relative;overflow:hidden}
.summary-art{position:absolute;right:8px;top:5px;width:105px;height:105px;opacity:.16}
.theme-btn{width:40px;height:40px;border:1px solid var(--line);border-radius:50%;font-size:18px}
.header-actions{display:flex;gap:7px;align-items:center}
.metric-grid{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.metric{background:var(--soft);border-radius:16px;padding:13px}
.metric b{display:block;font-size:21px}.metric span{font-size:11px;color:var(--muted)}
.progress-row{margin:13px 0}.progress-head{display:flex;justify-content:space-between;font-size:12px;font-weight:800;margin-bottom:6px}
.bar{height:9px;background:var(--soft);border-radius:99px;overflow:hidden}.bar i{display:block;height:100%;background:linear-gradient(90deg,#ff6b35,#ff9b6d);border-radius:99px}
.chart{width:100%;height:180px}.chart-bg{fill:var(--soft)}.chart-line{fill:none;stroke:#ff6b35;stroke-width:4;stroke-linecap:round;stroke-linejoin:round}.chart-dot{fill:#ff6b35}.chart-label{font-size:10px;fill:var(--muted)}
.weight-input{font-size:24px!important;font-weight:850;text-align:center;background:var(--soft)!important;border:0!important;padding:15px!important;width:100%;border-radius:14px}
.illustration{width:100%;height:130px;display:block}.ill-soft{fill:var(--soft)}.ill-ink{fill:var(--ink)}.ill-accent{fill:#ff6b35}
</style></head><body><div class="app">
<header><div><div class="brand">gym</div><div class="sub" id="subtitle">Your training, organized.</div></div><div class="header-actions"><button class="theme-btn" id="themeBtn" onclick="toggleTheme()" aria-label="Toggle dark mode">☾</button><div class="pill">🔥 <span id="streak">0</span></div></div></header>
<main id="main"></main>
<nav class="bottom"><button class="nav active" data-page="today"><span>●</span><b>Today</b></button><button class="nav" data-page="history"><span>◷</span><b>History</b></button><button class="nav" data-page="progress"><span>↗</span><b>Progress</b></button><button class="nav" data-page="more"><span>•••</span><b>More</b></button></nav>
</div><div class="timer" id="timer"></div><div class="modal" id="modal"><div class="sheet" id="sheet"></div></div>
<script>
const KEY='kevins_logs_local_v1';
let S=JSON.parse(localStorage.getItem(KEY)||'null')||{workouts:{},exercises:[],templates:[],measurements:[],goals:[],settings:{rest:90}};
let page='today', todayKey=()=>new Date().toISOString().slice(0,10), selected=new Date().toISOString().slice(0,10), timer=null;
const muscles=['Chest','Back','Shoulders','Biceps','Triceps','Quads','Hamstrings','Glutes','Calves','Abs','Other'];
if(!Array.isArray(S.weights))S.weights=[];
const defaults=[['Bench Press','Chest'],['Lat Pulldown','Back'],['Shoulder Press','Shoulders'],['Biceps Curl','Biceps'],['Triceps Pushdown','Triceps'],['Squat','Quads'],['Romanian Deadlift','Hamstrings'],['Leg Press','Quads'],['Calf Raise','Calves'],['Cable Crunch','Abs']];
if(!S.exercises.length)S.exercises=defaults.map((x,i)=>({id:i+1,name:x[0],muscle:x[1]}));
function save(){localStorage.setItem(KEY,JSON.stringify(S))}
function day(d){return S.workouts[d]||(S.workouts[d]={rest:false,notes:'',exercises:[]})}
function fmt(d){return new Date(d+'T12:00:00').toLocaleDateString(undefined,{month:'short',day:'numeric'})}
function weekStart(d){let x=new Date(d+'T12:00:00'), n=x.getDay()||7;x.setDate(x.getDate()-n+1);return x}
function iso(x){return x.toISOString().slice(0,10)}
function week(){let s=weekStart(selected);return [...Array(7)].map((_,i)=>{let x=new Date(s);x.setDate(s.getDate()+i);return iso(x)})}
function streak(){let n=0,d=new Date();for(;;){let k=iso(d),w=S.workouts[k];if(!w||w.rest||!w.exercises.some(e=>e.sets.some(s=>s.done)))break;n++;d.setDate(d.getDate()-1)}return n}
function totals(w){let ex=w?.exercises||[];return {ex:ex.length,sets:ex.reduce((a,e)=>a+e.sets.length,0),reps:ex.reduce((a,e)=>a+e.sets.reduce((b,s)=>b+(+s.reps||0),0),0)}}
function render(){document.getElementById('streak').textContent=streak();document.querySelectorAll('.nav').forEach(x=>x.classList.toggle('active',x.dataset.page===page));({today:renderToday,history:renderHistory,progress:renderProgress,more:renderMore}[page])()}
function renderToday(){let ds=week(),w=day(selected),t=totals(w);document.getElementById('main').innerHTML=`<div class="weekbar"><button class="arrow" onclick="moveWeek(-7)">‹</button><div class="weekdays">${ds.map((d,i)=>`<button class="day ${d===selected?'active':''}" onclick="selectDate('${d}')"><div>${['M','T','W','T','F','S','S'][i]}</div><div class="num">${+d.slice(-2)}</div></button>`).join('')}</div><button class="arrow" onclick="moveWeek(7)">›</button></div>
<div class="summary"><svg class="summary-art" viewBox="0 0 120 120"><rect x="25" y="52" width="70" height="16" rx="8" fill="white"/><rect x="13" y="35" width="13" height="50" rx="6" fill="white"/><rect x="94" y="35" width="13" height="50" rx="6" fill="white"/><rect x="4" y="43" width="9" height="34" rx="4" fill="white"/><rect x="107" y="43" width="9" height="34" rx="4" fill="white"/></svg><small>${fmt(selected)}</small><h2>${w.rest?'Rest Day':'Workout'}</h2><div class="stats"><div class="stat"><b>${t.ex}</b><span>Exercises</span></div><div class="stat"><b>${t.sets}</b><span>Sets</span></div><div class="stat"><b>${t.reps}</b><span>Reps</span></div></div></div>
${w.rest?`<div class="card empty">Rest day selected.<br><button class="btn light" style="margin-top:12px" onclick="setRest(false)">Undo rest day</button></div>`:`<div class="section"><h3>Exercises</h3><button class="btn orange" onclick="openAdd()">+ Add</button></div><div>${w.exercises.length?w.exercises.map(exCard).join(''):`<div class="card empty">No exercises yet.<br>Add an exercise to start today's workout.</div>`}</div><div class="section"><button class="btn light" onclick="setRest(true)">Mark Rest Day</button><button class="btn light" onclick="noteModal()">Notes</button></div>`}`;
}
function exCard(e){return `<div class="card"><div class="exhead"><div><div class="exname">${esc(e.name)}</div><span class="tag">${esc(e.muscle)}</span></div><button class="mini" onclick="removeEx('${e.id}')">Delete</button></div><div class="sets">${e.sets.map((s,i)=>`<div class="set"><span class="setnum">${i+1}</span><input type="number" inputmode="decimal" placeholder="Weight" value="${s.weight??''}" onchange="patch('${e.id}',${i},'weight',this.value)"><input type="number" inputmode="numeric" placeholder="Reps" value="${s.reps??''}" onchange="patch('${e.id}',${i},'reps',this.value)"><button class="check ${s.done?'done':''}" onclick="complete('${e.id}',${i})">${s.done?'✓':'○'}</button></div>`).join('')}</div><div style="display:flex;gap:7px;margin-top:9px"><button class="mini" onclick="addSet('${e.id}')">+ Set</button><button class="mini" onclick="rest()">Rest</button></div></div>`}
function renderHistory(){let rows=Object.entries(S.workouts).filter(([k,w])=>w.exercises.length||w.rest).sort((a,b)=>b[0].localeCompare(a[0]));document.getElementById('main').innerHTML=`<div class="section"><h2>Workout History</h2></div><div class="card">${rows.length?rows.map(([d,w])=>{let t=totals(w);return `<button class="historyitem" style="width:100%;background:none;text-align:left" onclick="selectDate('${d}');page='today';render()"><div><b>${fmt(d)}</b><div style="font-size:12px;color:var(--muted)">${w.rest?'Rest day':`${t.ex} exercises · ${t.sets} sets · ${t.reps} reps`}</div></div><b>›</b></button>`}).join(''):`<div class="empty">Your completed workouts will appear here.</div>`}</div>`}
function renderProgress(){let days=Object.entries(S.workouts).filter(([d,w])=>w.exercises?.some(e=>e.sets.some(s=>s.done)));let rows={},muscle={},sets=0,reps=0,volume=0;days.forEach(([d,w])=>(w.exercises||[]).forEach(e=>{(rows[e.name]??=[]).push(...e.sets);muscle[e.muscle]=(muscle[e.muscle]||0)+e.sets.filter(s=>s.done).length;e.sets.forEach(s=>{if(s.done){sets++;reps+=+s.reps||0;volume+=(+s.weight||0)*(+s.reps||0)}})}));let items=Object.entries(rows);let ms=Object.entries(muscle).sort((a,b)=>b[1]-a[1]).slice(0,5),mx=Math.max(1,...ms.map(x=>x[1]));let last7=[...Array(7)].map((_,i)=>{let d=new Date();d.setDate(d.getDate()-6+i);let k=iso(d);return {k,done:!!S.workouts[k]?.exercises?.some(e=>e.sets.some(s=>s.done))}});let active=last7.filter(x=>x.done).length;document.getElementById('main').innerHTML=`<div class="section"><h2>Progress</h2></div><div class="card"><svg class="illustration" viewBox="0 0 300 130"><polyline points="25,105 75,82 115,91 160,58 205,68 275,25" fill="none" stroke="#ff6b35" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/><circle cx="275" cy="25" r="9" fill="#ff6b35"/></svg><div class="metric-grid"><div class="metric"><b>${days.length}</b><span>Workout days</span></div><div class="metric"><b>${active}/7</b><span>Days this week</span></div><div class="metric"><b>${sets}</b><span>Completed sets</span></div><div class="metric"><b>${Math.round(volume).toLocaleString()}</b><span>Total volume</span></div></div></div><div class="section"><h3>Consistency</h3><span class="tag">Last 7 days</span></div><div class="card">${last7.map(x=>`<div class="progress-row"><div class="progress-head"><span>${new Date(x.k+'T12:00:00').toLocaleDateString(undefined,{weekday:'short'})}</span><span>${x.done?'Workout':'Off'}</span></div><div class="bar"><i style="width:${x.done?100:8}%"></i></div></div>`).join('')}</div><div class="section"><h3>Muscle groups</h3></div><div class="card">${ms.length?ms.map(([m,n])=>`<div class="progress-row"><div class="progress-head"><span>${esc(m)}</span><span>${n} sets</span></div><div class="bar"><i style="width:${Math.round(n/mx*100)}%"></i></div></div>`).join(''):`<div class="empty">Complete some sets to build your progress.</div>`}</div><div class="section"><h3>Exercise records</h3></div><div class="card">${items.length?items.slice(0,12).map(([name,ss])=>{let max=Math.max(0,...ss.map(s=>+s.weight||0)),best=Math.max(0,...ss.map(s=>+s.reps||0));return `<div class="historyitem"><div><b>${esc(name)}</b><div style="font-size:12px;color:var(--muted)">Best ${best} reps</div></div><b>${max||0}</b></div>`}).join(''):`<div class="empty">Log some workouts to see your records.</div>`}</div>`}
function renderMore(){let today=todayKey(),entries=(S.weights||[]).slice().sort((a,b)=>b.date.localeCompare(a.date)),cur=entries.find(x=>x.date===today),vals=entries.map(x=>+x.weight).filter(Number.isFinite),delta=vals.length>1?vals[0]-vals[1]:null;document.getElementById('main').innerHTML=`<div class="section"><h2>Weight</h2><span class="tag">${entries.length} entries</span></div><div class="card"><div class="weight-date">${fmt(today)}</div><input id="weightToday" class="weight-input" type="number" inputmode="decimal" step="0.1" placeholder="Enter weight" value="${cur?esc(cur.weight):''}"><button class="btn orange" style="width:100%;margin-top:10px" onclick="saveWeight()">Save today's weight</button>${delta!==null?`<div class="weight-delta">${delta>0?'+':''}${delta.toFixed(1)} from previous entry</div>`:''}</div><div class="section"><h3>History</h3></div><div class="card">${entries.length?`<svg class="chart" viewBox="0 0 320 180" preserveAspectRatio="none">${weightChart(entries.slice().reverse())}</svg>${entries.slice(0,20).map(x=>`<div class="historyitem"><div><b>${fmt(x.date)}</b><div style="font-size:12px;color:var(--muted)">Daily entry</div></div><b>${esc(x.weight)}</b></div>`).join('')}`:`<div class="empty"><svg class="illustration" viewBox="0 0 260 130"><circle cx="130" cy="65" r="48" class="ill-soft"/><path d="M88 72h84M96 72V52h16v20M148 72V52h16v20" fill="none" stroke="currentColor" stroke-width="9" stroke-linecap="round"/><circle cx="130" cy="35" r="7" class="ill-accent"/></svg><b>No entries yet</b><br>Add today's weight to start your history.</div>`}</div>`}
function saveWeight(){let v=parseFloat(document.getElementById('weightToday').value);if(!Number.isFinite(v)||v<=0){alert('Enter a valid weight.');return}let d=todayKey();S.weights=(S.weights||[]).filter(x=>x.date!==d);S.weights.push({date:d,weight:String(v)});S.weights.sort((a,b)=>a.date.localeCompare(b.date));save();render()}
function weightChart(es){if(es.length<2)return `<text x="160" y="90" text-anchor="middle" class="chart-label">Add another entry to see your trend</text>`;let v=es.map(x=>+x.weight),min=Math.min(...v),max=Math.max(...v),r=max-min||1,pts=es.map((x,i)=>[18+i/(es.length-1)*284,145-(+x.weight-min)/r*105]),path=pts.map((p,i)=>(i?'L':'M')+p[0]+','+p[1]).join(' ');return `<rect x="0" y="0" width="320" height="180" rx="16" class="chart-bg"/><path d="${path}" class="chart-line"/>${pts.map(p=>`<circle cx="${p[0]}" cy="${p[1]}" r="4.5" class="chart-dot"/>`).join('')}<text x="18" y="168" class="chart-label">${fmt(es[0].date)}</text><text x="302" y="168" text-anchor="end" class="chart-label">${fmt(es[es.length-1].date)}</text>`}
function openAdd(){document.getElementById('sheet').innerHTML=`<h2>Add Exercise</h2><div class="field"><label>Exercise</label><select id="pick">${S.exercises.map(e=>`<option value="${e.id}">${esc(e.name)} — ${esc(e.muscle)}</option>`).join('')}</select></div><div class="field"><label>Sets</label><input id="count" type="number" min="1" max="20" value="3"></div><div class="field"><label>Or create new exercise</label><input id="newname" placeholder="Exercise name"></div><div class="field"><select id="newmuscle">${muscles.map(m=>`<option>${m}</option>`).join('')}</select></div><div class="row"><button class="btn light" onclick="closeModal()">Cancel</button><button class="btn orange" onclick="addExercise()">Add</button></div>`;modal(true)}
function addExercise(){let name=document.getElementById('newname').value.trim(),id;if(name){id=Date.now();S.exercises.push({id,name,muscle:document.getElementById('newmuscle').value})}else id=+document.getElementById('pick').value;let ex=S.exercises.find(x=>x.id==id),n=Math.max(1,Math.min(20,+document.getElementById('count').value||3));day(selected).exercises.push({id:Date.now(),name:ex.name,muscle:ex.muscle,sets:Array.from({length:n},()=>({weight:'',reps:'',done:false}))});save();closeModal();render()}
function patch(id,i,f,v){let e=day(selected).exercises.find(x=>x.id==id);e.sets[i][f]=v;save()}
function complete(id,i){let e=day(selected).exercises.find(x=>x.id==id);e.sets[i].done=!e.sets[i].done;save();if(e.sets[i].done)startTimer();render()}
function addSet(id){let e=day(selected).exercises.find(x=>x.id==id);e.sets.push({weight:'',reps:'',done:false});save();render()}
function removeEx(id){day(selected).exercises=day(selected).exercises.filter(e=>e.id!=id);save();render()}
function setRest(v){day(selected).rest=v;save();render()}
function selectDate(d){selected=d;render()}
function moveWeek(n){let x=new Date(selected+'T12:00:00');x.setDate(x.getDate()+n);selected=iso(x);render()}
function noteModal(){let w=day(selected);document.getElementById('sheet').innerHTML=`<h2>Workout Notes</h2><div class="field"><textarea id="notes" rows="6" placeholder="How did the workout feel?">${esc(w.notes||'')}</textarea></div><div class="row"><button class="btn light" onclick="closeModal()">Cancel</button><button class="btn orange" onclick="day(selected).notes=document.getElementById('notes').value;save();closeModal();render()">Save</button></div>`;modal(true)}
function templates(){document.getElementById('sheet').innerHTML=`<h2>Templates</h2><div class="field"><input id="tname" placeholder="Template name"></div><button class="btn orange" onclick="saveTemplate()">Save current day as template</button><div style="margin-top:15px">${S.templates.map((t,i)=>`<div class="historyitem"><div><b>${esc(t.name)}</b><div style="font-size:12px;color:var(--muted)">${t.exercises.length} exercises</div></div><button class="mini" onclick="useTemplate(${i})">Use</button></div>`).join('')}</div>`;modal(true)}
function saveTemplate(){let n=document.getElementById('tname').value.trim();if(!n)return;S.templates.push({name:n,exercises:JSON.parse(JSON.stringify(day(selected).exercises))});save();templates()}
function useTemplate(i){day(selected).exercises=JSON.parse(JSON.stringify(S.templates[i].exercises));day(selected).exercises.forEach(e=>e.id=Date.now()+Math.random());save();closeModal();render()}
function measurements(){document.getElementById('sheet').innerHTML=`<h2>Body & Goals</h2><div class="field"><label>Body weight</label><input id="bw" type="number" inputmode="decimal" placeholder="Optional"></div><div class="field"><label>Goal</label><input id="goal" placeholder="Example: complete 4 workouts"></div><button class="btn orange" onclick="S.measurements.push({date:iso(new Date()),weight:document.getElementById('bw').value,goal:document.getElementById('goal').value});save();closeModal()">Save</button>`;modal(true)}
function rest(){startTimer()}
function startTimer(){clearInterval(timer);let n=+S.settings.rest||90,el=document.getElementById('timer');el.classList.add('show');function tick(){el.textContent=`Rest ${n}s  ×`;if(n--<1){clearInterval(timer);el.classList.remove('show')}}tick();timer=setInterval(tick,1000)}
function exportData(){let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(S,null,2)],{type:'application/json'}));a.download='kevins-logs-backup.json';a.click()}
function importData(){let i=document.createElement('input');i.type='file';i.accept='.json';i.onchange=()=>{let r=new FileReader();r.onload=()=>{try{S=JSON.parse(r.result);save();render()}catch{alert('Invalid backup')}};r.readAsText(i.files[0])};i.click()}
function modal(v){document.getElementById('modal').classList.toggle('open',v)}function closeModal(){modal(false)}
document.getElementById('modal').onclick=e=>{if(e.target.id==='modal')closeModal()}
document.querySelectorAll('.nav').forEach(b=>b.onclick=()=>{page=b.dataset.page;if(page==='today')selected=todayKey();render()});applyTheme();
function applyTheme(){let dark=localStorage.getItem('gym_theme')==='dark'||(localStorage.getItem('gym_theme')===null&&matchMedia('(prefers-color-scheme: dark)').matches);document.documentElement.dataset.theme=dark?'dark':'light';document.getElementById('themeMeta').content=dark?'#090a0d':'#f7f7fb';let b=document.getElementById('themeBtn');if(b)b.textContent=dark?'☀':'☾'}
function toggleTheme(){localStorage.setItem('gym_theme',document.documentElement.dataset.theme==='dark'?'light':'dark');applyTheme()}
function esc(x){return String(x??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
render();
</script></body></html>
