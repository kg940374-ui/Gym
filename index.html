<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#090a0d" id="themeMeta">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="gym">
<title>gym</title>
<style>
:root{--bg:#f7f7fb;--card:#fff;--ink:#17181c;--muted:#858a96;--line:#e8e9ee;--soft:#f0f1f5;--accent:#ff6b35;--green:#22b573;--shadow:0 8px 24px rgba(20,20,30,.07)}
html[data-theme=dark]{--bg:#090a0d;--card:#15171c;--ink:#f5f7fa;--muted:#9da3ae;--line:#292d35;--soft:#20232a}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",sans-serif}
body{overscroll-behavior:none}button,input,select,textarea{font:inherit}input,select,textarea{font-size:16px!important}button{border:0;cursor:pointer;color:inherit}
.app{max-width:430px;min-height:100vh;margin:auto;padding-bottom:calc(88px + env(safe-area-inset-bottom))}
header{padding:calc(18px + env(safe-area-inset-top)) 18px 10px;display:flex;justify-content:space-between;align-items:center}
.brand{font-size:28px;font-weight:800;letter-spacing:-.8px}.sub{font-size:13px;color:var(--muted);margin-top:3px}
.header-actions{display:flex;gap:7px;align-items:center}.pill,.theme-btn{background:var(--card);border:1px solid var(--line);box-shadow:var(--shadow)}
.pill{padding:9px 12px;border-radius:999px;font-weight:700}.theme-btn{width:40px;height:40px;border-radius:50%;font-size:18px}
main{padding:8px 15px}.weekbar{display:grid;grid-template-columns:28px 1fr 28px;align-items:center;gap:5px;margin:8px 0 14px}
.weekdays{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}.day{padding:8px 2px;border-radius:16px;background:var(--card);color:var(--muted);text-align:center;box-shadow:var(--shadow);border:1px solid var(--line)}
.day.active{background:var(--ink);color:var(--bg)}.day .num{font-weight:800;font-size:15px;margin-top:3px}.arrow{background:transparent;color:var(--muted);font-size:24px;padding:4px}
.summary{background:linear-gradient(135deg,#17181c,#30323a);color:#fff;border-radius:24px;padding:18px;box-shadow:var(--shadow);margin-bottom:14px}
.summary small{opacity:.65}.summary h2{margin:4px 0 12px;font-size:23px}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{background:#ffffff12;border-radius:15px;padding:10px}.stat b{display:block;font-size:18px}.stat span{font-size:10px;opacity:.7}
.section{display:flex;justify-content:space-between;align-items:center;margin:16px 3px 8px;gap:8px}.section h2,.section h3{margin:0;color:var(--ink)}.section h3{font-size:17px}
.btn{border-radius:999px;padding:11px 15px;font-weight:800;background:var(--ink);color:var(--bg)}.btn.orange{background:var(--accent);color:#fff}
.btn.light{background:var(--card);color:var(--ink);box-shadow:var(--shadow);border:1px solid var(--line)}
.card{background:var(--card);border:1px solid var(--line);border-radius:21px;padding:14px;margin:9px 0;box-shadow:var(--shadow)}
.exhead{display:flex;justify-content:space-between;align-items:center;gap:8px}.exname{font-size:16px;font-weight:800}
.tag{font-size:10px;background:var(--soft);padding:5px 8px;border-radius:999px;color:var(--muted)}.sets{margin-top:10px;display:grid;gap:7px}
.set{display:grid;grid-template-columns:25px 1fr 1fr 40px;gap:6px;align-items:center}.setnum{font-size:11px;color:var(--muted);text-align:center}
.set input{min-width:0;width:100%;border:1px solid var(--line);background:var(--soft);color:var(--ink);border-radius:12px;padding:10px;text-align:center;font-weight:700;outline:none}
.check{width:40px;height:40px;border-radius:13px;background:var(--soft);color:var(--muted);font-weight:900}.check.done{background:var(--green);color:#fff}
.mini{padding:7px 9px;border-radius:10px;background:var(--soft);color:var(--ink);font-size:11px;font-weight:800}.empty{text-align:center;padding:38px 15px;color:var(--muted)}
.bottom{position:fixed;left:50%;bottom:0;transform:translateX(-50%);width:min(430px,100%);padding:9px 12px calc(9px + env(safe-area-inset-bottom));background:color-mix(in srgb,var(--card) 94%,transparent);backdrop-filter:blur(18px);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(4,1fr);z-index:5}
.nav{background:none;color:var(--muted);padding:5px}.nav.active{color:var(--ink)}.nav b{display:block;font-size:11px;margin-top:2px}.nav span{font-size:20px}
.modal{display:none;position:fixed;inset:0;background:#0008;z-index:20;align-items:flex-end}.modal.open{display:flex}
.sheet{width:min(430px,100%);margin:auto;background:var(--card);color:var(--ink);border-radius:25px 25px 0 0;padding:20px 17px calc(20px + env(safe-area-inset-bottom));max-height:85vh;overflow:auto}
.sheet h2{margin:0 0 15px;color:var(--ink)}.field{margin:11px 0}.field label{display:block;font-size:12px;font-weight:800;margin-bottom:6px;color:var(--ink)}
.field input,.field select,.field textarea{width:100%;border:1px solid var(--line);border-radius:13px;padding:11px;background:var(--soft);color:var(--ink);outline:none}
.row{display:flex;gap:8px}.row>*{flex:1}.historyitem{display:flex;justify-content:space-between;padding:13px 0;border-bottom:1px solid var(--line)}
.timer{position:fixed;left:50%;top:calc(12px + env(safe-area-inset-top));transform:translateX(-50%);z-index:30;background:#17181c;color:#fff;border-radius:999px;padding:10px 15px;display:none;box-shadow:var(--shadow)}.timer.show{display:block}
.metric-grid{display:grid;grid-template-columns:1fr 1fr;gap:9px}.metric{background:var(--soft);border-radius:16px;padding:13px}.metric b{display:block;font-size:21px}.metric span{font-size:11px;color:var(--muted)}
.progress-row{margin:13px 0}.progress-head{display:flex;justify-content:space-between;font-size:12px;font-weight:800;margin-bottom:6px}.bar{height:9px;background:var(--soft);border-radius:99px;overflow:hidden}.bar i{display:block;height:100%;background:linear-gradient(90deg,#ff6b35,#ff9b6d);border-radius:99px}
.weight-input{font-size:24px!important;font-weight:850;text-align:center;background:var(--soft)!important;border:0!important;padding:15px!important;width:100%;border-radius:14px}
</style>
</head>
<body>
<div class="app">
<header><div><div class="brand">gym</div><div class="sub">Your training, organized.</div></div><div class="header-actions"><button class="theme-btn" id="themeBtn" onclick="toggleTheme()">☾</button><div class="pill">🔥 <span id="streak">0</span></div></div></header>
<main id="main"></main>
<nav class="bottom"><button class="nav active" data-page="today"><span>●</span><b>Today</b></button><button class="nav" data-page="history"><span>◷</span><b>History</b></button><button class="nav" data-page="progress"><span>↗</span><b>Progress</b></button><button class="nav" data-page="more"><span>•••</span><b>More</b></button></nav>
</div><div class="timer" id="timer"></div><div class="modal" id="modal"><div class="sheet" id="sheet"></div></div>
<script>
const KEY='kevins_logs_local_v1';
let S=JSON.parse(localStorage.getItem(KEY)||'null')||{workouts:{},exercises:[],templates:[],measurements:[],goals:[],settings:{rest:90},weights:[]};
let page='today',selected=new Date().toISOString().slice(0,10),timer=null;
const muscles=['Chest','Back','Shoulders','Biceps','Triceps','Legs','Abs','Other'];
// Migrate the old leg sub-categories into the new single Legs category.
if(Array.isArray(S.exercises))S.exercises.forEach(e=>{if(['Hamstrings','Glutes','Calves','Quads'].includes(e.muscle))e.muscle='Legs'});
if(S.workouts)Object.values(S.workouts).forEach(w=>(w.exercises||[]).forEach(e=>{if(['Hamstrings','Glutes','Calves','Quads'].includes(e.muscle))e.muscle='Legs'}));
save();
const defaults=[['Bench Press','Chest'],['Lat Pulldown','Back'],['Shoulder Press','Shoulders'],['Biceps Curl','Biceps'],['Triceps Pushdown','Triceps'],['Squat','Quads'],['Romanian Deadlift','Hamstrings'],['Leg Press','Quads'],['Calf Raise','Calves'],['Cable Crunch','Abs']];
if(!S.workouts)S.workouts={};if(!Array.isArray(S.exercises))S.exercises=[];if(!Array.isArray(S.weights))S.weights=[];
if(!S.exercises.length)S.exercises=defaults.map((x,i)=>({id:i+1,name:x[0],muscle:x[1]}));
function save(){localStorage.setItem(KEY,JSON.stringify(S))}function iso(x){return x.toISOString().slice(0,10)}function todayKey(){return iso(new Date())}
function day(d){return S.workouts[d]||(S.workouts[d]={rest:false,notes:'',exercises:[]})}
function fmt(d){return new Date(d+'T12:00:00').toLocaleDateString(undefined,{month:'short',day:'numeric'})}
function weekStart(d){let x=new Date(d+'T12:00:00'),n=x.getDay()||7;x.setDate(x.getDate()-n+1);return x}
function week(){let s=weekStart(selected);return[...Array(7)].map((_,i)=>{let x=new Date(s);x.setDate(s.getDate()+i);return iso(x)})}
function streak(){let days=new Set(Object.entries(S.workouts).filter(([d,w])=>w&&!w.rest&&(w.exercises||[]).some(e=>(e.sets||[]).some(s=>s.done))).map(x=>x[0]));let d=new Date(),k=iso(d);if(!days.has(k)){d.setDate(d.getDate()-1);k=iso(d)}let n=0;while(days.has(k)){n++;d.setDate(d.getDate()-1);k=iso(d)}return n}
function totals(w){let ex=w?.exercises||[];return{ex:ex.length,sets:ex.reduce((a,e)=>a+e.sets.length,0),reps:ex.reduce((a,e)=>a+e.sets.reduce((b,s)=>b+(+s.reps||0),0),0)}}
function render(){document.getElementById('streak').textContent=streak();document.querySelectorAll('.nav').forEach(x=>x.classList.toggle('active',x.dataset.page===page));({today:renderToday,history:renderHistory,progress:renderProgress,more:renderMore}[page])()}
function renderToday(){let ds=week(),w=day(selected),t=totals(w);document.getElementById('main').innerHTML=`<div class="weekbar"><button class="arrow" onclick="moveWeek(-7)">‹</button><div class="weekdays">${ds.map((d,i)=>`<button class="day ${d===selected?'active':''}" onclick="selectDate('${d}')"><div>${['M','T','W','T','F','S','S'][i]}</div><div class="num">${+d.slice(-2)}</div></button>`).join('')}</div><button class="arrow" onclick="moveWeek(7)">›</button></div><div class="summary"><small>${fmt(selected)}</small><h2>${w.rest?'Rest Day':'Workout'}</h2><div class="stats"><div class="stat"><b>${t.ex}</b><span>Exercises</span></div><div class="stat"><b>${t.sets}</b><span>Sets</span></div><div class="stat"><b>${t.reps}</b><span>Reps</span></div></div></div>${w.rest?`<div class="card empty">Rest day selected.<br><button class="btn light" style="margin-top:12px" onclick="setRest(false)">Undo rest day</button></div>`:`<div class="section"><h3>Exercises</h3><button class="btn orange" onclick="openAdd()">+ Add Exercise</button></div><div>${w.exercises.length?w.exercises.map(exCard).join(''):`<div class="card empty">No exercises yet.<br>Add an exercise to start today's workout.</div>`}</div><div class="section"><button class="btn light" onclick="setRest(true)">Mark Rest Day</button><button class="btn light" onclick="noteModal()">Notes</button></div>`}`}
function exCard(e){return`<div class="card"><div class="exhead"><div><div style="display:flex;align-items:center;gap:6px"><div class="exname">${esc(e.name)}</div><button class="mini" onclick="editExercise('${e.id}')">Edit</button></div><span class="tag">${esc(e.muscle)}</span></div><button class="mini" onclick="removeEx('${e.id}')">Delete</button></div><div class="sets">${e.sets.map((s,i)=>`<div class="set"><span class="setnum">${esc(s.name||('Set '+(i+1)))}</span><input type="number" inputmode="decimal" placeholder="Weight" value="${s.weight??''}" onchange="patch('${e.id}',${i},'weight',this.value)"><input type="number" inputmode="numeric" placeholder="Reps" value="${s.reps??''}" onchange="patch('${e.id}',${i},'reps',this.value)"><button class="check ${s.done?'done':''}" onclick="complete('${e.id}',${i})">${s.done?'✓':'○'}</button></div>`).join('')}</div><div style="display:flex;gap:7px;margin-top:9px"><button class="mini" onclick="addSet('${e.id}')">+ Set</button><button class="mini" onclick="editExercise('${e.id}')">Edit Exercise</button><button class="mini" onclick="rest()">Rest</button></div></div>`}
function openAdd(){document.getElementById('sheet').innerHTML=`<h2>Add Exercise</h2><div class="field"><label>Exercise</label><select id="pick">${S.exercises.map(e=>`<option value="${e.id}">${esc(e.name)} — ${esc(e.muscle)}</option>`).join('')}</select></div><div class="field"><label>Sets</label><input id="count" type="number" min="1" max="20" value="3"></div><div class="field"><label>Or create new exercise</label><input id="newname" placeholder="Exercise name"></div><div class="field"><label>Muscle group</label><select id="newmuscle">${muscles.map(m=>`<option>${m}</option>`).join('')}</select></div><div class="row"><button class="btn light" onclick="closeModal()">Cancel</button><button class="btn orange" onclick="addExercise()">Add</button></div>`;modal(true)}
function addExercise(){let name=document.getElementById('newname').value.trim(),id;if(name){
  let nm=document.getElementById('newmuscle').value;
  let existing=S.exercises.find(x=>x.name.toLowerCase()===name.toLowerCase());
  if(existing){id=existing.id;existing.name=name;existing.muscle=nm}
  else{id=Date.now();S.exercises.push({id,name,muscle:nm})}
}else id=+document.getElementById('pick').value;let ex=S.exercises.find(x=>x.id==id),n=Math.max(1,Math.min(20,+document.getElementById('count').value||3));day(selected).exercises.push({id:Date.now(),name:ex.name,muscle:ex.muscle,sets:Array.from({length:n},()=>({name:'',weight:'',reps:'',done:false}))});save();closeModal();render()}
function editExercise(id){let e=day(selected).exercises.find(x=>String(x.id)===String(id));if(!e)return;document.getElementById('sheet').innerHTML=`<h2>Edit Exercise</h2><div class="field"><label>Exercise name</label><input id="editName" value="${esc(e.name)}"></div><div class="field"><label>Muscle group</label><select id="editMuscle">${muscles.map(m=>`<option ${m===e.muscle?'selected':''}>${esc(m)}</option>`).join('')}</select></div><div class="field"><label>Set names</label>${e.sets.map((s,i)=>`<div style="display:flex;gap:7px;margin:7px 0"><input data-set="${i}" value="${esc(s.name||'')}" placeholder="Set ${i+1} name"></div>`).join('')}</div><div class="row"><button class="btn light" onclick="closeModal()">Cancel</button><button class="btn orange" onclick="saveExerciseEdit('${e.id}')">Save Changes</button></div>`;modal(true)}
function syncExerciseLibrary(oldName,newName,muscle){
  S.exercises.forEach(x=>{if(x.name===oldName){x.name=newName;x.muscle=muscle}});
  Object.values(S.workouts).forEach(w=>(w.exercises||[]).forEach(x=>{
    if(x.name===oldName){x.name=newName;x.muscle=muscle}
  }));
}
function saveExerciseEdit(id){
  let e=day(selected).exercises.find(x=>String(x.id)===String(id));if(!e)return;
  let oldName=e.name,n=document.getElementById('editName').value.trim();
  if(!n)n=oldName;
  let muscle=document.getElementById('editMuscle').value;
  e.name=n;e.muscle=muscle;
  syncExerciseLibrary(oldName,n,muscle);
  document.querySelectorAll('[data-set]').forEach(x=>{let i=+x.dataset.set;if(e.sets[i])e.sets[i].name=x.value.trim()});
  save();closeModal();render()
}
function patch(id,i,f,v){let e=day(selected).exercises.find(x=>x.id==id);if(e)e.sets[i][f]=v;save()}
function complete(id,i){let e=day(selected).exercises.find(x=>x.id==id);if(!e)return;e.sets[i].done=!e.sets[i].done;save();if(e.sets[i].done)startTimer();render()}
function addSet(id){let e=day(selected).exercises.find(x=>x.id==id);if(e)e.sets.push({name:'',weight:'',reps:'',done:false});save();render()}
function removeEx(id){day(selected).exercises=day(selected).exercises.filter(e=>e.id!=id);save();render()}
function setRest(v){day(selected).rest=v;save();render()}
function selectDate(d){selected=d;page='today';render()}
function moveWeek(n){let d=new Date(selected+'T12:00:00');d.setDate(d.getDate()+n);selected=iso(d);render()}
function rest(){let s=Number(S.settings?.rest)||90;let end=Date.now()+s*1000;clearInterval(timer);let el=document.getElementById('timer');el.classList.add('show');timer=setInterval(()=>{let left=Math.max(0,end-Date.now());el.textContent='Rest '+Math.ceil(left/1000)+'s';if(!left){clearInterval(timer);el.textContent='Rest complete';setTimeout(()=>el.classList.remove('show'),1800)}},200)}
function startTimer(){rest()}
function noteModal(){let w=day(selected);document.getElementById('sheet').innerHTML=`<h2>Workout Notes</h2><div class="field"><textarea id="notes" rows="7" placeholder="Notes for this workout...">${esc(w.notes||'')}</textarea></div><button class="btn orange" style="width:100%" onclick="saveNotes()">Save Notes</button>`;modal(true)}
function saveNotes(){day(selected).notes=document.getElementById('notes').value;save();closeModal();render()}
function renderHistory(){let rows=Object.entries(S.workouts).filter(([k,w])=>w.exercises.length||w.rest).sort((a,b)=>b[0].localeCompare(a[0]));document.getElementById('main').innerHTML=`<div class="section"><h2>Workout History</h2></div><div class="card">${rows.length?rows.map(([d,w])=>{let t=totals(w);return`<button class="historyitem" style="width:100%;background:none;text-align:left;color:var(--ink)" onclick="selectDate('${d}')"><div><b>${fmt(d)}</b><div style="font-size:12px;color:var(--muted)">${w.rest?'Rest day':`${t.ex} exercises · ${t.sets} sets · ${t.reps} reps`}</div></div><b>›</b></button>`}).join(''):`<div class="empty">Your completed workouts will appear here.</div>`}</div>`}
function renderProgress(){let days=Object.entries(S.workouts).filter(([d,w])=>w.exercises?.some(e=>e.sets.some(s=>s.done)));let muscle={},sets=0,volume=0;days.forEach(([d,w])=>w.exercises.forEach(e=>{muscle[e.muscle]=(muscle[e.muscle]||0)+e.sets.filter(s=>s.done).length;e.sets.forEach(s=>{if(s.done){sets++;volume+=(+s.weight||0)*(+s.reps||0)}})}));let ms=Object.entries(muscle).sort((a,b)=>b[1]-a[1]).slice(0,8),mx=Math.max(1,...ms.map(x=>x[1]));document.getElementById('main').innerHTML=`<div class="section"><h2>Progress</h2></div><div class="card"><div class="metric-grid"><div class="metric"><b>${days.length}</b><span>Workout days</span></div><div class="metric"><b>${sets}</b><span>Completed sets</span></div><div class="metric"><b>${Math.round(volume).toLocaleString()}</b><span>Total volume</span></div><div class="metric"><b>${streak()}</b><span>Current streak</span></div></div></div><div class="section"><h3>Muscle groups</h3></div><div class="card">${ms.length?ms.map(([m,n])=>`<div class="progress-row"><div class="progress-head"><span>${esc(m)}</span><span>${n} sets</span></div><div class="bar"><i style="width:${Math.round(n/mx*100)}%"></i></div></div>`).join(''):`<div class="empty">Complete some sets to build your progress.</div>`}</div>`}
function renderMore(){
  let entries=(S.weights||[]).slice().sort((a,b)=>b.date.localeCompare(a.date)),
      cur=entries.find(x=>x.date===todayKey());
  let now=new Date(); now.setHours(12,0,0,0);
  let recent=entries.filter(x=>{let d=new Date(x.date+'T12:00:00');let diff=Math.floor((now-d)/86400000);return diff>=0&&diff<7;});
  let avg=recent.length?(recent.reduce((a,x)=>a+parseFloat(x.weight),0)/recent.length).toFixed(1):'—';
  let trend='';
  if(entries.length>=2){
    let diff=parseFloat(entries[0].weight)-parseFloat(entries[1].weight);
    trend=diff>0?`<span style="color:#d55">+${diff.toFixed(1)} lb</span>`:diff<0?`<span style="color:var(--green)">${diff.toFixed(1)} lb</span>`:`<span style="color:var(--muted)">No change</span>`;
  }
  document.getElementById('main').innerHTML=`
  <div class="section"><h2>Weight</h2><span class="tag">${entries.length} entries</span></div>
  <div class="card">
    <div class="metric-grid">
      <div class="metric"><b>${cur?esc(cur.weight):'—'}</b><span>Today's weight</span></div>
      <div class="metric"><b>${avg}</b><span>7-day average</span></div>
    </div>
    ${trend?`<div style="margin-top:12px;font-size:12px;color:var(--muted)">Change from previous entry: <b>${trend}</b></div>`:''}
    <div style="font-size:12px;color:var(--muted);text-align:center;margin:15px 0 6px">${fmt(todayKey())}</div>
    <input id="weightToday" class="weight-input" type="number" inputmode="decimal" step=".1" placeholder="Enter weight" value="${cur?esc(cur.weight):''}">
    <button class="btn orange" style="width:100%;margin-top:10px" onclick="saveWeight()">Save today's weight</button>
  </div>
  <div class="section"><h3>Data Backup</h3></div>
  <div class="card">
    <p style="font-size:13px;color:var(--muted);line-height:1.45">Export a backup before changing devices or websites. Importing a backup replaces the current app data.</p>
    <div class="row"><button class="btn light" onclick="exportData()">Export</button><button class="btn orange" onclick="importData()">Import</button></div>
  </div>
  <div class="section"><h3>Weight History</h3></div>
  <div class="card">${entries.length?entries.slice(0,20).map(x=>`<div class="historyitem"><div><b>${fmt(x.date)}</b><div style="font-size:12px;color:var(--muted)">Daily entry</div></div><b>${esc(x.weight)} lb</b></div>`).join(''):`<div class="empty">No weight entries yet.</div>`}</div>`;
}
function saveWeight(){let v=parseFloat(document.getElementById('weightToday').value);if(!Number.isFinite(v)||v<=0){alert('Enter a valid weight.');return}let d=todayKey();S.weights=(S.weights||[]).filter(x=>x.date!==d);S.weights.push({date:d,weight:String(v)});save();render()}
function exportData(){let blob=new Blob([JSON.stringify(S,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='gym-backup-'+todayKey()+'.json';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000)}
function importData(){let input=document.createElement('input');input.type='file';input.accept='.json,application/json';input.onchange=()=>{let file=input.files[0];if(!file)return;let r=new FileReader();r.onload=()=>{try{let data=JSON.parse(r.result);if(!data||typeof data!=='object'||!data.workouts)throw Error();if(!confirm('Import this backup? Current app data will be replaced.'))return;S=data;if(!Array.isArray(S.weights))S.weights=[];if(!Array.isArray(S.exercises))S.exercises=[];
S.exercises.forEach(e=>{if(['Hamstrings','Glutes','Calves','Quads'].includes(e.muscle))e.muscle='Legs'});
Object.values(S.workouts).forEach(w=>(w.exercises||[]).forEach(e=>{if(['Hamstrings','Glutes','Calves','Quads'].includes(e.muscle))e.muscle='Legs'}));
save();selected=todayKey();page='today';render();alert('Backup imported successfully.')}catch{alert('That file is not a valid gym backup.')}};r.readAsText(file)};input.click()}
function modal(v){document.getElementById('modal').classList.toggle('open',v)}function closeModal(){modal(false)}
document.getElementById('modal').onclick=e=>{if(e.target.id==='modal')closeModal()}
document.querySelectorAll('.nav').forEach(b=>b.onclick=()=>{page=b.dataset.page;if(page==='today')selected=todayKey();render()})
function applyTheme(){let dark=localStorage.getItem('gym_theme')==='dark'||(localStorage.getItem('gym_theme')===null&&matchMedia('(prefers-color-scheme: dark)').matches);document.documentElement.dataset.theme=dark?'dark':'light';document.getElementById('themeMeta').content=dark?'#090a0d':'#f7f7fb';document.getElementById('themeBtn').textContent=dark?'☀':'☾'}
function toggleTheme(){localStorage.setItem('gym_theme',document.documentElement.dataset.theme==='dark'?'light':'dark');applyTheme()}
function esc(x){return String(x??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
applyTheme();render();
</script>
</body>
</html>
